<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 538" width="960" height="538" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ligação unidirecional: a saída de áudio do PC A vai na entrada de áudio do PC B</title>
  <style>
    .flui { animation: flui 0.9s linear infinite; }
    .flui-volta { animation: flui-volta 0.9s linear infinite; }
    @keyframes flui { to { stroke-dashoffset: -22; } }
    @keyframes flui-volta { to { stroke-dashoffset: 22; } }
    @media (prefers-reduced-motion: reduce) { .flui, .flui-volta { animation: none; } }
    @media (prefers-color-scheme: dark) {
      rect[fill="#ffffff"] { fill: #0d1117; }
      rect[fill="#f3f4f6"] { fill: #161b22; }
      rect[stroke="#9ca3af"] { stroke: #6e7681; }
      rect[fill="#e5e7eb"] { fill: #21262d; }
      rect[stroke="#d1d5db"] { stroke: #30363d; }
      rect[fill="#111827"] { fill: #1c2128; stroke: #444c56; }
      path[fill="#111827"] { fill: #444c56; }
      path[stroke="#1f2937"] { stroke: #6e7681; }
      rect[fill="#eff6ff"] { fill: #0d1a2e; stroke: #1f3a68; }
      rect[fill="#fef3c7"] { fill: #2e2208; stroke: #9e6a03; }
      circle[fill="#fbcfe8"] { fill: #5c2340; }
      circle[fill="#bbf7d0"] { fill: #1b4d2e; }
      circle[stroke="#d1d5db"] { stroke: #30363d; }
      circle[fill="#374151"] { fill: #6e7681; }
      circle[stroke="#111827"] { stroke: #c9d1d9; }
      text[fill="#111827"] { fill: #e6edf3; }
      text[fill="#374151"] { fill: #c9d1d9; }
      text[fill="#4b5563"] { fill: #9da5af; }
      text[fill="#6b7280"], text[fill="#9ca3af"] { fill: #8b949e; }
      text[fill="#1e3a8a"] { fill: #a5c8ff; }
      text[fill="#15803d"] { fill: #3fb950; }
      text[fill="#be185d"] { fill: #f778ba; }
      text[fill="#1d4ed8"], text[fill="#2563eb"] { fill: #58a6ff; }
      text[fill="#c2410c"] { fill: #ffa657; }
      text[fill="#92400e"] { fill: #f2cc60; }
    }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="538" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">Ligação unidirecional (um cabo)</text>
  <text x="480" y="66" text-anchor="middle" font-size="14" fill="#4b5563">A saída de áudio de um PC entra na entrada de áudio do outro. Os dados vão só de A para B.</text>

  <!-- PC A -->
  <rect x="40" y="100" width="300" height="230" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="190" y="132" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">PC A</text>
  <text x="190" y="154" text-anchor="middle" font-size="14" fill="#374151">transmite (TX)</text>
  <rect x="80" y="172" width="220" height="110" rx="8" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="210" y="194" text-anchor="middle" font-size="12" fill="#6b7280">conectores de áudio</text>
  <!-- saída usada -->
  <circle cx="130" cy="232" r="17" fill="#22c55e" stroke="#15803d" stroke-width="3"/>
  <circle cx="130" cy="232" r="6" fill="#14532d"/>
  <text x="130" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">SAÍDA</text>
  <text x="130" y="286" text-anchor="middle" font-size="11" fill="#374151">fone / linha</text>
  <!-- entrada não usada -->
  <circle cx="250" cy="232" r="17" fill="#fbcfe8" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="250" cy="232" r="6" fill="#9ca3af"/>
  <text x="250" y="270" text-anchor="middle" font-size="12" fill="#9ca3af">entrada</text>
  <text x="250" y="286" text-anchor="middle" font-size="11" fill="#9ca3af">(livre)</text>

  <!-- PC B -->
  <rect x="620" y="100" width="300" height="230" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="770" y="132" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">PC B</text>
  <text x="770" y="154" text-anchor="middle" font-size="14" fill="#374151">recebe (RX)</text>
  <rect x="660" y="172" width="220" height="110" rx="8" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="750" y="194" text-anchor="middle" font-size="12" fill="#6b7280">conectores de áudio</text>
  <!-- saída não usada -->
  <circle cx="710" cy="232" r="17" fill="#bbf7d0" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="710" cy="232" r="6" fill="#9ca3af"/>
  <text x="710" y="270" text-anchor="middle" font-size="12" fill="#9ca3af">saída</text>
  <text x="710" y="286" text-anchor="middle" font-size="11" fill="#9ca3af">(livre)</text>
  <!-- entrada usada -->
  <circle cx="830" cy="232" r="17" fill="#ec4899" stroke="#be185d" stroke-width="3"/>
  <circle cx="830" cy="232" r="6" fill="#831843"/>
  <text x="830" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#be185d">ENTRADA</text>
  <text x="830" y="286" text-anchor="middle" font-size="11" fill="#374151">microfone / linha</text>

  <!-- cabo -->
  <path d="M130,215 L130,96 Q130,84 142,84 L818,84 Q830,84 830,96 L830,215" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <path d="M130,215 L130,96 Q130,84 142,84 L818,84 Q830,84 830,96 L830,215" fill="none" stroke="#2563eb" stroke-width="2" class="flui" stroke-dasharray="10 12" marker-end="url(#seta)"/>
  <rect x="122" y="196" width="16" height="22" rx="3" fill="#6b7280"/>
  <rect x="822" y="196" width="16" height="22" rx="3" fill="#6b7280"/>
  <rect x="380" y="104" width="200" height="44" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="480" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">cabo P2 (3,5 mm)</text>
  <text x="480" y="140" text-anchor="middle" font-size="12" fill="#4b5563">macho-macho, estéreo</text>
  <text x="480" y="176" text-anchor="middle" font-size="13" fill="#2563eb">sinal: A → B</text>

  <!-- comandos -->
  <rect x="40" y="350" width="300" height="80" rx="8" fill="#111827"/>
  <text x="56" y="374" font-size="12" fill="#9ca3af">PC A (envia)</text>
  <text x="56" y="396" font-size="12" fill="#f9fafb" font-family="Consolas, Menlo, monospace">python -m soundbridge --tx ARQ</text>
  <text x="56" y="416" font-size="12" fill="#f9fafb" font-family="Consolas, Menlo, monospace">  --out SAÍDA</text>
  <rect x="620" y="350" width="300" height="80" rx="8" fill="#111827"/>
  <text x="636" y="374" font-size="12" fill="#9ca3af">PC B (recebe)</text>
  <text x="636" y="396" font-size="12" fill="#f9fafb" font-family="Consolas, Menlo, monospace">python -m soundbridge --rx PASTA</text>
  <text x="636" y="416" font-size="12" fill="#f9fafb" font-family="Consolas, Menlo, monospace">  --in ENTRADA</text>
  <text x="480" y="384" text-anchor="middle" font-size="13" fill="#4b5563">--out = conector de saída do PC A</text>
  <text x="480" y="404" text-anchor="middle" font-size="13" fill="#4b5563">--in = conector de entrada do PC B</text>

  <!-- dicas -->
  <rect x="40" y="448" width="880" height="72" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="58" y="472" font-size="13" fill="#1e3a8a">• Se o PC B tiver <tspan font-weight="600">entrada de linha</tspan> (geralmente azul), prefira-a ao microfone: sem ganho alto e sem AGC.</text>
  <text x="58" y="492" font-size="13" fill="#1e3a8a">• No microfone: volume de gravação baixo, sem reforço (boost) e sem melhorias/AGC. Rode <tspan font-family="Consolas, Menlo, monospace">--calibrate</tspan> para achar o nível.</text>
  <text x="58" y="512" font-size="13" fill="#1e3a8a">• Sem o 2º cabo (B → A) só há modo unidirecional: o RX não confirma nem pede reenvio.</text>
</svg>
